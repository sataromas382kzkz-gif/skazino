<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#111827"><title>Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header><div class="avatar" id="avatar">✦</div><div><b id="name">Загрузка...</b><small>Твой личный кабинет</small></div><div class="stars">⭐ <span id="stars">—</span></div></header>
    <section class="hero"><span>TELEGRAM MINI APP</span><h1>Привет,<br><strong id="heroName">друг</strong> 👋</h1><p>Получай бонусы и управляй профилем прямо в Telegram.</p></section>
    <section class="card"><div><small>ЕЖЕДНЕВНЫЙ БОНУС</small><h2>+25 ⭐</h2><p>Заходи каждый день и забирай награду.</p></div><button id="daily">Забрать</button></section>
    <section class="stats"><div><small>БАЛАНС</small><b>⭐ <span id="statStars">—</span></b></div><div><small>ЗАДАНИЯ</small><b id="tasks">—</b></div></section>
    <div id="toast"></div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
